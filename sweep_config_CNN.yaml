program: train_with_yaml.py
name: pick_fitting_name
method: bayes
metric:
  name: AUC
  goal: maximize
parameters:
  architecture:
    value: CNN 
  data_type: 
    value: combined
  normalize:  
    value: True
  combined_end_motif:
    value: True
  early_stopping:
    value: True
  early_stopping_patience:
    value: 10
  pooling: 
    value: False
  pooling_type:
    value: Local
  num_filters:
    values: [64, 128, 256]
  kernel_size:
    values: [4, 5, 6]
  length_hidden_size: 
    values: [32, 64, 128, 256]
  fusion_hidden_size: 
    values: [64, 128, 256, 512]
  optimizer:
    values: ["Adam", "SGD"]
  momentum:
    distribution: uniform
    min: 0.8
    max: 0.95
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.004
  scheduler:
    values: ["None", "CosineAnnealingLR", "OneCycleLR"]
  scheduler_lr_max:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  scheduler_lr_min:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0001
  weight_decay:
    values: [1e-5, 1e-4, 1e-3]
  loss:
    value: BCE
  batch_size:
    values: [128, 256, 512, 1024]
  epochs:
    value: 50
  log_interval:
    value: 500
